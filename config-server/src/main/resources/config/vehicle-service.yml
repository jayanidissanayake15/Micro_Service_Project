server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:vehicle_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: kaveesha-server:vehicle-service:8082
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
